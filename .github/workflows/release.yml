name: Release

# Changesets on main open (or update) the "Release pr-bar" PR, which bumps
# package.json, plugin.json and the marketplace entry and writes CHANGELOG.md.
# Merging it tags the version and publishes a GitHub release with that
# changelog entry. Nothing goes to npm: the package is private.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release

jobs:
  release:
    name: Release PR or GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Open the release PR, or tag and release
        id: changesets
        uses: changesets/action@v2.1.2
        with:
          version-script: npm run version-packages
          publish-script: npm run release
          commit-message: Release pr-bar
          pr-title: Release pr-bar

      # Pushes made with GITHUB_TOKEN don't start CI.
      - name: Start CI on the release PR
        if: steps.changesets.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref changeset-release/main
