name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The dependabot-changeset and release workflows start CI this way after they push,
  # since pushes made with GITHUB_TOKEN don't.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The plugin API is early access and can change between releases: bump on purpose.
  CLAUDE_CODE_VERSION: 2.1.287

jobs:
  check:
    name: Lint, type-check, validate, test, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Claude Code
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Lint (Biome)
        run: npm run lint

      - name: Versions agree
        run: npm run version-check

      - name: Lay the plugin API types
        run: npm run types

      - name: Type-check
        run: npm run typecheck

      - name: Validate the plugin and marketplace
        run: npm run validate

      - name: Test
        run: npm test

      - name: Coverage (100% required)
        run: npm run coverage

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  changeset:
    name: Changeset added
    # Dependabot's own pushes have no changeset yet: the dependabot-changeset
    # workflow adds one to its npm PRs, then dispatches CI on the branch.
    # Its GitHub Actions PRs don't change the plugin, so they skip this, and so
    # does the release PR, which consumes the changesets.
    if: >-
      !startsWith(github.head_ref || github.ref_name, 'changeset-release/')
      && ((github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]')
          || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: A changeset describes this change
        run: npx changeset status --since="origin/${{ github.base_ref || 'main' }}"
