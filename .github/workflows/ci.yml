name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The dependabot-version workflow starts CI this way after it pushes a bump.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The plugin API is early access and can change between releases: bump on purpose.
  CLAUDE_CODE_VERSION: 2.1.287

jobs:
  check:
    name: Lint, type-check, validate, test, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Claude Code
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Lint
        run: npm run lint

      - name: Lay the plugin API types
        run: npm run types

      - name: Type-check
        run: npm run typecheck

      - name: Validate the plugin and marketplace
        run: npm run validate

      - name: Test
        run: npm test

      - name: Coverage (100% required)
        run: npm run coverage

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  version:
    name: Version bumped
    # Dependabot's own pushes aren't bumped yet: the dependabot-version workflow
    # bumps them, then dispatches CI on the branch, which checks against main.
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]')
      || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the base branch
        run: git fetch --no-tags --depth=1 origin "${{ github.base_ref || 'main' }}"

      - name: Version is higher than the base branch's
        run: node scripts/version.mjs "origin/${{ github.base_ref || 'main' }}"
