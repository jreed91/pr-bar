# Dependabot can't write a changeset; the dependabot-changeset workflow adds a
# patch one to its npm PRs. Its GitHub Actions PRs skip the changeset check.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
